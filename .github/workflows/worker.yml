name: Deploy Cloudflare Worker
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackjack-worker-production
  cancel-in-progress: false

jobs:
  worker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          AUTH_BRIDGE_KEY: ${{ secrets.AUTH_BRIDGE_KEY }}
      - name: Resolve the public Worker origin
        id: worker-origin
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
        run: node scripts/resolve-worker-origin.mjs
      - name: Verify the public health endpoint
        env:
          WORKER_URL: ${{ steps.worker-origin.outputs.origin }}
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        shell: bash
        run: |
          if [[ -n "$WORKER_URL" ]]; then
            app_origin=$(node -p 'new URL(process.env.APP_URL).origin')
            curl --proto '=https' --retry 4 --retry-all-errors --max-time 15 \
              --fail --silent --show-error -H "Origin: $app_origin" -- "$WORKER_URL/api/health" |
              node -e '
                const health = JSON.parse(require("node:fs").readFileSync(0, "utf8"))
                if (health.status !== "ok" || health.database !== true || health.authConfigured !== true) {
                  throw new Error("Blackjack API, D1, or Auth settings are unavailable")
                }
                console.log("Blackjack API, D1, and Auth configuration verified")
              '
          fi
